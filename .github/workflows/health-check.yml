name: VPS Health Check

on:
  schedule:
    # Every 5 minutes. Times in UTC; matthew's wall-clock alerts will fire at any hour.
    - cron: '*/5 * * * *'
  # Allow manual trigger from GitHub Actions tab for ad-hoc verification.
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    # Hard cap so a hung curl never holds the runner for hours.
    timeout-minutes: 3

    steps:
      # Check 1: n8n-main responsive.
      - name: Ping n8n-main health
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "Pinging n8n-main..."
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 25 \
            "https://automations.vciosolutions.com/login" || echo "000")
          echo "n8n-main response: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 500 ] || [ "${HTTP_CODE}" = "000" ]; then
            echo "FAILED_CHECKS=true" >> "$GITHUB_ENV"
            echo "::error::n8n-main returned ${HTTP_CODE} (VPS or n8n process down)"
            exit 1
          fi

      # Check 2: n8n-main Intake webhook path alive.
      - name: Ping n8n-main Intake webhook
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "Pinging n8n-main Intake webhook..."
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X HEAD \
            --max-time 25 \
            "https://automations.vciosolutions.com/webhook/call-qa-intake" || true)
          echo "Intake webhook response: ${HTTP_CODE}"
          # Treat 404 as alive (webhook exists; HEAD not allowed is common).
          # Only 5xx (server error) and 000 (no response) are real failures.
          if [ "${HTTP_CODE}" -ge 500 ] || [ "${HTTP_CODE}" = "000" ]; then
            echo "FAILED_CHECKS=true" >> "$GITHUB_ENV"
            echo "::error::n8n-main Intake webhook returned ${HTTP_CODE} (VPS or webhook broken)"
            exit 1
          fi

      # Check 3: rustdesk-relay VPS (formerly misconfigured as n8n-tools).
      # Goal: detect VPS server-up, not n8n-up. Hit IP directly so any HTTP
      # response (even 404) proves the VPS is alive — RustDesk runs on the box,
      # not n8n, and we don't care which app answers.
      - name: Ping n8n-tools VPS
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "Pinging n8n-tools (rustdesk relay VPS, IP direct)..."
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 25 \
            "http://2.24.213.194/" || echo "000")
          echo "n8n-tools response: ${HTTP_CODE}"
          # VPS liveness only: any HTTP response means server-up.
          # 000 = no response (curl failed, host unreachable, network down).
          if [ "${HTTP_CODE}" = "000" ]; then
            echo "FAILED_CHECKS=true" >> "$GITHUB_ENV"
            echo "::error::n8n-tools VPS unreachable: ${HTTP_CODE}"
            exit 1
          fi

      # Notify on any failure above.
      - name: Failure summary
        if: always()
        run: |
          if [ -n "${FAILED_CHECKS:-}" ]; then
            echo "::error::One or more VPS health checks FAILED — see job logs above."
            exit 1
          else
            echo "All VPS health checks passed."
          fi
